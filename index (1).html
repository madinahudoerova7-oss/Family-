<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oila daraxti</title>
<style>
  :root { --bg:#f6f1e7; --card:#fffaf0; --line:#8b6b3d; --ink:#3b2c1a; --accent:#2f6b4f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, serif; background:var(--bg); color:var(--ink); }
  header { text-align:center; padding:28px 16px 8px; }
  header h1 { margin:0; font-size:2rem; color:var(--accent); }
  header p { margin:6px 0 0; opacity:.7; }
  #search { display:block; margin:14px auto; padding:10px 14px; width:min(360px,90%);
            border:1px solid var(--line); border-radius:10px; background:var(--card); font-size:1rem; }
  .wrap { max-width:720px; margin:0 auto; padding:10px 8px 60px; }
  .cols { display:flex; gap:8px; }
  .col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; padding-bottom:22px; }
  .col::after { content:''; position:absolute; bottom:0; left:50%; height:22px; border-left:2px solid var(--line); }
  .col h2 { margin:0 0 12px; font-size:1.05rem; color:var(--accent); }
  .link { width:0; height:18px; border-left:2px solid var(--line); }
  .join { width:50%; margin:0 auto; border-top:2px solid var(--line); height:0; }
  .stem { width:0; height:22px; border-left:2px solid var(--line); margin:0 auto; }
  .bottom { text-align:center; }
  .person { display:inline-block; width:100%; max-width:170px; padding:10px 12px; background:var(--card);
            border:2px solid var(--line); border-radius:12px; cursor:pointer; transition:.15s; text-align:center; }
  .person:hover { transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.15); }
  .person img { width:56px; height:56px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 6px; }
  .person b { display:block; font-size:.95rem; }
  .person small { opacity:.7; }
  .spouse { font-size:.78rem; margin-top:4px; color:var(--accent); }
  .person.male { border-color:#3b6ea5; } .person.female { border-color:#b5547c; }
  .person.hit { background:#ffe9a8; }
  .person.big { max-width:210px; border-width:3px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; padding:16px; }
  #modal.open { display:flex; }
  #box { background:var(--card); border-radius:16px; padding:22px; max-width:380px; width:100%; text-align:center; }
  #box img { width:110px; height:110px; border-radius:50%; object-fit:cover; }
  #box button { margin-top:12px; padding:8px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; }
  footer { text-align:center; opacity:.6; padding:20px; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1 id="title">Oila daraxti</h1>
  <p>Avlodlar shajarasi</p>
</header>
<input id="search" type="search" placeholder="Ism bo'yicha qidirish...">
<div class="wrap">
  <div class="cols" id="cols"></div>
  <div class="join"></div>
  <div class="stem"></div>
  <div class="bottom" id="bottom"></div>
</div>
<div id="modal"><div id="box"></div></div>
<footer>Ma'lumotlarni family.js faylida o'zgartiring</footer>

<script src="family.js"></script>
<script>
  document.getElementById('title').textContent = FAMILY_TITLE;

  function card(p, big) {
    const el = document.createElement('div');
    el.className = 'person ' + (p.gender || '') + (big ? ' big' : '');
    el.dataset.name = (p.name + ' ' + (p.spouse || '')).toLowerCase();
    el.innerHTML =
      (p.photo ? `<img src="${p.photo}" alt="">` : '') +
      `<b>${p.name}</b>` +
      (p.years ? `<small>${p.years}</small>` : '') +
      (p.spouse ? `<div class="spouse">♥ ${p.spouse}</div>` : '');
    el.onclick = () => openModal(p);
    return el;
  }

  function column(side) {
    const col = document.createElement('div');
    col.className = 'col';
    const h = document.createElement('h2');
    h.textContent = side.title;
    col.appendChild(h);
    side.chain.forEach((p, i) => {
      if (i > 0) { const l = document.createElement('div'); l.className = 'link'; col.appendChild(l); }
      col.appendChild(card(p));
    });
    return col;
  }

  const cols = document.getElementById('cols');
  cols.appendChild(column(FAMILY.left));
  cols.appendChild(column(FAMILY.right));
  document.getElementById('bottom').appendChild(card(FAMILY.child, true));

  function openModal(p) {
    document.getElementById('box').innerHTML =
      (p.photo ? `<img src="${p.photo}" alt=""><br>` : '') +
      `<h2>${p.name}</h2>` +
      (p.years ? `<p>${p.years}</p>` : '') +
      (p.spouse ? `<p>Turmush o'rtog'i: ${p.spouse}</p>` : '') +
      (p.note ? `<p>${p.note}</p>` : '') +
      `<button onclick="document.getElementById('modal').classList.remove('open')">Yopish</button>`;
    document.getElementById('modal').classList.add('open');
  }
  document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') e.target.classList.remove('open'); };

  document.getElementById('search').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.person').forEach(el => {
      el.classList.toggle('hit', q && el.dataset.name.includes(q));
    });
  };
</script>
</body>
</html>
